version: 2

updates:
  # One grouped PR a week per ecosystem: every PR costs a full CI run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - ci
    commit-message:
      prefix: "ci:"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    # Raise the constraint instead of widening it: "^1.2 || ^2.0" promises a
    # major that no job tests (root AGENTS.md, one major per constraint).
    versioning-strategy: increase
    # rasuvaeff/* move together with their families, by hand.
    ignore:
      - dependency-name: "rasuvaeff/*"
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"
    groups:
      composer:
        patterns: ["*"]
