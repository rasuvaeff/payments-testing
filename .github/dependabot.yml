version: 2

updates:
  # One grouped PR a week per ecosystem: every PR costs a full CI run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - ci
    commit-message:
      prefix: "ci:"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    # Libraries have no lock file. "increase" raised every floor to the newest
    # release, and a dev tool's newest release can drop the package's oldest
    # PHP (roave 8.27 needs 8.4: payments#18 failed on 8.3 and Prefer lowest).
    # "increase-if-necessary" touches a constraint only when a new release
    # falls outside it — a new major — and replaces it instead of widening it
    # to "^1.2 || ^2.0" (root AGENTS.md, one major per constraint). Floors stay
    # where the Prefer lowest job tests them.
    versioning-strategy: increase-if-necessary
    # rasuvaeff/* move together with their families, by hand.
    ignore:
      - dependency-name: "rasuvaeff/*"
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"
    groups:
      composer:
        patterns: ["*"]
